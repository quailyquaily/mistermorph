name: Build Desktop App

on:
  push:
    tags-ignore:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    name: Build Desktop App (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-24.04
          - label: macos-arm64
            os: macos-14
          - label: windows-amd64
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up the desktop app build
        uses: ./.github/actions/setup-desktop-build

      - name: Test the desktop shell
        shell: bash
        run: cd desktop/nsh && cargo test

      # The GPUI shell (desktop/nsh) and a backend with the nsh Console embedded, side by side.
      - name: Build desktop app and bundled backend
        shell: bash
        run: |
          exe=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then exe=".exe"; fi
          ./scripts/build-desktop.sh --release \
            --desktop-output "./dist/MrMorph${exe}" \
            --backend-output "./dist/morph${exe}"
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          sum "dist/MrMorph${exe}" > "dist/MrMorph${exe}.sha256"
          sum "dist/morph${exe}" > "dist/morph${exe}.sha256"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        env:
          VERSION: "0.0.0"
          ARCH: arm64
        run: ./desktop/nsh/packaging/package-darwin.sh

      - name: Package Linux AppImage and DEB
        if: runner.os == 'Linux'
        env:
          VERSION: "0.0.0"
          ARCH: amd64
        run: |
          ./desktop/nsh/packaging/package-linux-appimage.sh
          ./desktop/nsh/packaging/package-linux-deb.sh

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrMorph-${{ matrix.label }}
          path: |
            dist/MrMorph*
            dist/morph*
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3
