name: Build Desktop App

on:
  push:
    tags-ignore:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    name: Build Wails App (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-latest
          - label: macos-arm64
            os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/console/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir web/console install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir web/console build

      - name: Install Linux desktop build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Verify desktop package compiles
        run: go test -tags "wailsdesktop production" ./desktop/wails -count=1

      - name: Build desktop app and bundled backend
        run: |
          ./scripts/build-desktop.sh --release --no-frontend \
            --desktop-output ./dist/MrMorph \
            --backend-output ./dist/morph
          shasum -a 256 dist/MrMorph > dist/MrMorph.sha256
          shasum -a 256 dist/morph > dist/morph.sha256

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        env:
          VERSION: "0.0.0"
          ARCH: arm64
        run: ./desktop/wails/packaging/package-darwin.sh

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrMorph-${{ matrix.label }}
          path: |
            dist/MrMorph
            dist/MrMorph.sha256
            dist/morph
            dist/morph.sha256
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3
