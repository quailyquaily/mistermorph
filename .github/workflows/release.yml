name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Shared by mistermorph and mistermorph-pro. Only the channel block differs
# between the two repositories; keep everything else identical.
env:
  # --- Release channel -------------------------------------------------------
  RELEASE_CHANNEL: community
  GO_BUILD_TAGS: ""
  GORELEASER_CONFIG: .goreleaser.yaml
  # Number of public GitHub releases to keep; 0 publishes to R2 only.
  GITHUB_RELEASES_TO_KEEP: "10"
  # ---------------------------------------------------------------------------
  R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
  R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || vars.R2_PUBLIC_BASE_URL }}
  R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
  # The aws CLI reads credentials only from AWS_* variables; both come from the R2 secrets.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # R2 does not take the integrity checksums aws CLI 2.23+ sends by default; send them only
  # where an operation requires one. Retry failed requests inside the CLI as well.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_RETRY_MODE: adaptive
  AWS_MAX_ATTEMPTS: "10"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up the console build
        uses: ./.github/actions/setup-desktop-build
        with:
          gpui: "false"

      # The Console the CLI embeds: web/console-nsh as a static site.
      - name: Build the console
        shell: bash
        run: web/console-nsh/scripts/build-web.sh web/console-nsh/dist

      - name: Stage console assets
        shell: bash
        run: ./scripts/stage-console-assets.sh

      - name: Run tests
        run: go test -tags "${GO_BUILD_TAGS}" ./...

  goreleaser:
    # macOS, so the darwin CLI binaries can be signed and notarized as they are built
    # (scripts/macos-sign-cli.sh, a GoReleaser post-build hook).
    needs: test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up the console build
        uses: ./.github/actions/setup-desktop-build
        with:
          gpui: "false"

      # The Console the CLI embeds: web/console-nsh as a static site.
      - name: Build the console
        shell: bash
        run: web/console-nsh/scripts/build-web.sh web/console-nsh/dist

      - name: Stage console assets
        shell: bash
        run: ./scripts/stage-console-assets.sh

      - name: Set up macOS signing
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./scripts/macos-signing-setup.sh

      - name: Validate R2 settings
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          for name in \
            CF_ACCOUNT_ID \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            R2_BUCKET \
            R2_PUBLIC_BASE_URL
          do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required R2 release settings:\n' >&2
            printf '  %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Run GoReleaser (tag release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config ${{ env.GORELEASER_CONFIG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_MACOS_SIGNING: "true"

      - name: Upload CLI release files to R2
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist/cli-release
          find dist -maxdepth 1 -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "checksums.txt" \) -exec cp {} dist/cli-release/ \;
          if ! find dist/cli-release -type f | grep -q .; then
            echo "no CLI release files found" >&2
            exit 1
          fi
          ./scripts/release-r2-upload.sh dist/cli-release "s3://${R2_BUCKET}/${RELEASE_CHANNEL}/releases/${GITHUB_REF_NAME}/"

      - name: Run GoReleaser (snapshot)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --config ${{ env.GORELEASER_CONFIG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-dist
          path: dist/*
          retention-days: 3

  desktop-apps:
    name: Build Desktop App (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
            desktop_asset: MrMorph-linux-amd64.AppImage
            deb_asset: MrMorph-linux-amd64.deb
            update_asset: MrMorph-linux-amd64.tar.gz
            raw_desktop_binary: dist/MrMorph
            bundled_backend_binary: dist/morph
            package_kind: appimage
          - label: macos-arm64
            os: macos-15
            goos: darwin
            goarch: arm64
            desktop_asset: MrMorph-darwin-arm64.dmg
            deb_asset: ""
            update_asset: MrMorph-darwin-arm64.tar.gz
            raw_desktop_binary: dist/MrMorph
            bundled_backend_binary: dist/morph
            package_kind: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up the desktop app build
        uses: ./.github/actions/setup-desktop-build

      # The GPUI shell in desktop/nsh draws web/console-nsh itself (build.rs runs `nsh build`).
      - name: Build desktop app binary
        shell: bash
        run: |
          mkdir -p dist
          shell_args=(--skip-backend --output-dir dist)
          if [[ " ${GO_BUILD_TAGS} " == *" pro "* ]]; then
            shell_args+=(--pro)
          fi
          VERSION="${GITHUB_REF_NAME#v}" ./desktop/nsh/build.sh "${shell_args[@]}"

      # The shell draws the console, so the bundled backend serves only the API.
      - name: Build bundled backend binary
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -tags "noembedconsole ${GO_BUILD_TAGS}" -ldflags "-s -w" -o "${{ matrix.bundled_backend_binary }}" ./cmd/mistermorph

      - name: Set up macOS signing
        if: matrix.package_kind == 'dmg'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./scripts/macos-signing-setup.sh

      - name: Package macOS DMG
        if: matrix.package_kind == 'dmg'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}" \
          ARCH="${ARCH}" \
          DESKTOP_BIN="${{ matrix.raw_desktop_binary }}" \
          BACKEND_BIN="${{ matrix.bundled_backend_binary }}" \
          OUT_DIR="dist" \
          BUNDLED_BACKEND_NAME="morph" \
          TARBALL_PATH="dist/${{ matrix.update_asset }}" \
          ./desktop/nsh/packaging/package-darwin.sh

      - name: Package Linux AppImage
        if: matrix.package_kind == 'appimage'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}" \
          ARCH="${ARCH}" \
          DESKTOP_BIN="${{ matrix.raw_desktop_binary }}" \
          BACKEND_BIN="${{ matrix.bundled_backend_binary }}" \
          OUT_DIR="dist" \
          APPIMAGE_NAME="${{ matrix.desktop_asset }}" \
          TARBALL_PATH="dist/${{ matrix.update_asset }}" \
          ./desktop/nsh/packaging/package-linux-appimage.sh

      - name: Package Linux DEB
        if: matrix.package_kind == 'appimage'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}" \
          ARCH="${ARCH}" \
          DESKTOP_BIN="${{ matrix.raw_desktop_binary }}" \
          BACKEND_BIN="${{ matrix.bundled_backend_binary }}" \
          OUT_DIR="dist" \
          DEB_NAME="${{ matrix.deb_asset }}" \
          ./desktop/nsh/packaging/package-linux-deb.sh

      - name: Generate checksum
        shell: bash
        run: |
          assets=("${{ matrix.desktop_asset }}")
          if [[ -n "${{ matrix.update_asset }}" && "${{ matrix.update_asset }}" != "${{ matrix.desktop_asset }}" ]]; then
            assets+=("${{ matrix.update_asset }}")
          fi
          if [[ -n "${{ matrix.deb_asset }}" ]]; then
            assets+=("${{ matrix.deb_asset }}")
          fi
          for file in "${assets[@]}"; do
            shasum -a 256 "dist/${file}" > "dist/${file}.sha256"
          done

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p dist/release-upload
          cp "dist/${{ matrix.desktop_asset }}" "dist/${{ matrix.desktop_asset }}.sha256" dist/release-upload/
          if [[ -n "${{ matrix.update_asset }}" && "${{ matrix.update_asset }}" != "${{ matrix.desktop_asset }}" ]]; then
            cp "dist/${{ matrix.update_asset }}" "dist/${{ matrix.update_asset }}.sha256" dist/release-upload/
          fi
          if [[ -n "${{ matrix.deb_asset }}" ]]; then
            cp "dist/${{ matrix.deb_asset }}" "dist/${{ matrix.deb_asset }}.sha256" dist/release-upload/
          fi

      - name: Upload desktop release files to R2
        shell: bash
        run: |
          ./scripts/release-r2-upload.sh dist/release-upload "s3://${R2_BUCKET}/${RELEASE_CHANNEL}/releases/${GITHUB_REF_NAME}/"

      - name: Upload desktop release files to GitHub
        if: env.GITHUB_RELEASES_TO_KEEP != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/release-upload/* --clobber

  android-app:
    name: Build Android App
    if: startsWith(github.ref, 'refs/tags/')
    needs: goreleaser
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      # Android installs an update only when it is signed with the same key as the installed app,
      # and a runner's debug key is new every run: without the release keystore there is no
      # Android asset.
      - name: Check the release keystore
        id: keystore
        shell: bash
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS is not set: no Android app in this release"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.keystore.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up the console build
        if: steps.keystore.outputs.ready == 'true'
        uses: ./.github/actions/setup-desktop-build
        with:
          gpui: "false"
          components: web android

      - name: Install the Android platform
        if: steps.keystore.outputs.ready == 'true'
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null

      # The phone app (web/console-nsh as a client of a console server elsewhere), for phones'
      # arm64-v8a and armeabi-v7a.
      - name: Build the APK
        if: steps.keystore.outputs.ready == 'true'
        shell: bash
        env:
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keystore="${RUNNER_TEMP}/release.keystore"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          VERSION="${GITHUB_REF_NAME}" web/console-nsh/scripts/build-android.sh \
            --keystore "${keystore}" --key-alias "${ANDROID_KEY_ALIAS}" \
            --out dist/release-upload/MrMorph-android.apk
          rm -f "${keystore}"
          (cd dist/release-upload && shasum -a 256 MrMorph-android.apk > MrMorph-android.apk.sha256)

      - name: Upload Android release files to R2
        if: steps.keystore.outputs.ready == 'true'
        shell: bash
        run: |
          ./scripts/release-r2-upload.sh dist/release-upload "s3://${R2_BUCKET}/${RELEASE_CHANNEL}/releases/${GITHUB_REF_NAME}/"

      - name: Upload Android release files to GitHub
        if: steps.keystore.outputs.ready == 'true' && env.GITHUB_RELEASES_TO_KEEP != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/release-upload/* --clobber

  release-metadata:
    name: Publish Release Metadata
    # After the Android app's assets too, but a failed Android build does not hold the release back.
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.desktop-apps.result == 'success'
    needs: [desktop-apps, android-app]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Publish update manifest and release index to R2
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: ./scripts/release-publish-metadata.sh

      - name: Prune old GitHub releases
        if: env.GITHUB_RELEASES_TO_KEEP != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: ./scripts/release-prune-github.sh "${GITHUB_RELEASES_TO_KEEP}"
