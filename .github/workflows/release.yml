name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Shared by mistermorph and mistermorph-pro. Only the channel block differs
# between the two repositories; keep everything else identical.
env:
  # --- Release channel -------------------------------------------------------
  RELEASE_CHANNEL: community
  GO_BUILD_TAGS: ""
  GORELEASER_CONFIG: .goreleaser.yaml
  CONSOLE_VITE_CONFIG: vite.config.js
  # Number of public GitHub releases to keep; 0 publishes to R2 only.
  GITHUB_RELEASES_TO_KEEP: "10"
  # ---------------------------------------------------------------------------
  R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
  R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || vars.R2_PUBLIC_BASE_URL }}
  R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
  # The aws CLI reads credentials only from AWS_* variables; both come from the R2 secrets.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/console/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir web/console install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir web/console exec vite build --config "${CONSOLE_VITE_CONFIG}"

      - name: Stage console assets
        shell: bash
        run: ./scripts/stage-console-assets.sh

      - name: Run tests
        run: go test -tags "${GO_BUILD_TAGS}" ./...

      - name: Validate R2 settings
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          for name in \
            CF_ACCOUNT_ID \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            R2_BUCKET \
            R2_PUBLIC_BASE_URL
          do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required R2 release settings:\n' >&2
            printf '  %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Run GoReleaser (tag release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config ${{ env.GORELEASER_CONFIG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CLI release files to R2
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist/cli-release
          find dist -maxdepth 1 -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "checksums.txt" \) -exec cp {} dist/cli-release/ \;
          if ! find dist/cli-release -type f | grep -q .; then
            echo "no CLI release files found" >&2
            exit 1
          fi
          aws s3 cp dist/cli-release "s3://${R2_BUCKET}/${RELEASE_CHANNEL}/releases/${GITHUB_REF_NAME}/" \
            --recursive \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress

      - name: Run GoReleaser (snapshot)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --config ${{ env.GORELEASER_CONFIG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-dist
          path: dist/*
          retention-days: 3

  desktop-apps:
    name: Build Desktop App (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
            desktop_asset: MrMorph-linux-amd64.AppImage
            deb_asset: MrMorph-linux-amd64.deb
            update_asset: MrMorph-linux-amd64.tar.gz
            raw_desktop_binary: dist/MrMorph
            bundled_backend_binary: dist/morph
            package_kind: appimage
          - label: macos-arm64
            os: macos-14
            goos: darwin
            goarch: arm64
            desktop_asset: MrMorph-darwin-arm64.dmg
            deb_asset: ""
            update_asset: MrMorph-darwin-arm64.tar.gz
            raw_desktop_binary: dist/MrMorph
            bundled_backend_binary: dist/morph
            package_kind: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/console/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir web/console install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir web/console exec vite build --config "${CONSOLE_VITE_CONFIG}"

      - name: Stage console assets
        shell: bash
        run: ./scripts/stage-console-assets.sh

      - name: Install Linux desktop build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Verify desktop package compiles
        shell: bash
        run: go test -tags "wailsdesktop production ${GO_BUILD_TAGS}" ./desktop/wails -count=1

      - name: Build desktop app binary
        shell: bash
        run: |
          mkdir -p dist
          desktop_version="${GITHUB_REF_NAME#v}"
          desktop_ldflags="-s -w -X main.desktopVersion=${desktop_version}"
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -tags "wailsdesktop production ${GO_BUILD_TAGS}" -ldflags "${desktop_ldflags}" -o "${{ matrix.raw_desktop_binary }}" ./desktop/wails

      - name: Build bundled backend binary
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -tags "${GO_BUILD_TAGS}" -ldflags "-s -w" -o "${{ matrix.bundled_backend_binary }}" ./cmd/mistermorph

      - name: Validate macOS signing secrets
        if: matrix.package_kind == 'dmg'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_CODESIGN_IDENTITY \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required macOS release secrets:\n' >&2
            printf '  %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Import macOS signing certificate
        if: matrix.package_kind == 'dmg'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE="$(mktemp "${RUNNER_TEMP}/cert.XXXXXX").p12"
          echo "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${CERT_FILE}"
          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security import "${CERT_FILE}" -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "${KEYCHAIN}"
          rm -f "${CERT_FILE}"

      - name: Package macOS DMG
        if: matrix.package_kind == 'dmg'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.goarch }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION="${VERSION#v}" \
          ARCH="${ARCH}" \
          DESKTOP_BIN="${{ matrix.raw_desktop_binary }}" \
          BACKEND_BIN="${{ matrix.bundled_backend_binary }}" \
          OUT_DIR="dist" \
          BUNDLED_BACKEND_NAME="morph" \
          TARBALL_PATH="dist/${{ matrix.update_asset }}" \
          CODESIGN_IDENTITY="${CODESIGN_IDENTITY}" \
          APPLE_ID="${APPLE_ID}" \
          APPLE_TEAM_ID="${APPLE_TEAM_ID}" \
          APPLE_APP_PASSWORD="${APPLE_APP_PASSWORD}" \
          ./desktop/wails/packaging/package-darwin.sh

      - name: Package Linux AppImage
        if: matrix.package_kind == 'appimage'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}" \
          ARCH="${ARCH}" \
          DESKTOP_BIN="${{ matrix.raw_desktop_binary }}" \
          BACKEND_BIN="${{ matrix.bundled_backend_binary }}" \
          OUT_DIR="dist" \
          APPIMAGE_NAME="${{ matrix.desktop_asset }}" \
          TARBALL_PATH="dist/${{ matrix.update_asset }}" \
          ./desktop/wails/packaging/package-linux-appimage.sh

      - name: Package Linux DEB
        if: matrix.package_kind == 'appimage'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}" \
          ARCH="${ARCH}" \
          DESKTOP_BIN="${{ matrix.raw_desktop_binary }}" \
          BACKEND_BIN="${{ matrix.bundled_backend_binary }}" \
          OUT_DIR="dist" \
          DEB_NAME="${{ matrix.deb_asset }}" \
          ./desktop/wails/packaging/package-linux-deb.sh

      - name: Generate checksum
        shell: bash
        run: |
          assets=("${{ matrix.desktop_asset }}")
          if [[ -n "${{ matrix.update_asset }}" && "${{ matrix.update_asset }}" != "${{ matrix.desktop_asset }}" ]]; then
            assets+=("${{ matrix.update_asset }}")
          fi
          if [[ -n "${{ matrix.deb_asset }}" ]]; then
            assets+=("${{ matrix.deb_asset }}")
          fi
          for file in "${assets[@]}"; do
            shasum -a 256 "dist/${file}" > "dist/${file}.sha256"
          done

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p dist/release-upload
          cp "dist/${{ matrix.desktop_asset }}" "dist/${{ matrix.desktop_asset }}.sha256" dist/release-upload/
          if [[ -n "${{ matrix.update_asset }}" && "${{ matrix.update_asset }}" != "${{ matrix.desktop_asset }}" ]]; then
            cp "dist/${{ matrix.update_asset }}" "dist/${{ matrix.update_asset }}.sha256" dist/release-upload/
          fi
          if [[ -n "${{ matrix.deb_asset }}" ]]; then
            cp "dist/${{ matrix.deb_asset }}" "dist/${{ matrix.deb_asset }}.sha256" dist/release-upload/
          fi

      - name: Upload desktop release files to R2
        shell: bash
        run: |
          aws s3 cp dist/release-upload "s3://${R2_BUCKET}/${RELEASE_CHANNEL}/releases/${GITHUB_REF_NAME}/" \
            --recursive \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress

      - name: Upload desktop release files to GitHub
        if: env.GITHUB_RELEASES_TO_KEEP != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/release-upload/* --clobber

  release-metadata:
    name: Publish Release Metadata
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop-apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Publish update manifest and release index to R2
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: ./scripts/release-publish-metadata.sh

      - name: Prune old GitHub releases
        if: env.GITHUB_RELEASES_TO_KEEP != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: ./scripts/release-prune-github.sh "${GITHUB_RELEASES_TO_KEEP}"
