name: Build iOS App

# The iPhone app (web/console-nsh/scripts/build-ios.sh): Morph.ipa, signed for the App Store and
# uploaded to TestFlight. Run by hand (Actions → Build iOS App → Run workflow) or by release.yml on
# each tag. It needs macOS, so it runs on GitHub's runner; nothing here needs a Mac of your own.
#
# Secrets: IOS_CERTIFICATE_BASE64 and IOS_CERTIFICATE_PASSWORD (the Apple Distribution .p12),
# IOS_CODESIGN_IDENTITY ("Apple Distribution: Example Inc (TEAMID1234)"),
# IOS_PROVISIONING_PROFILE_BASE64 (the App Store .mobileprovision), IOS_APP_STORE_APP_ID (the app's
# numeric Apple ID in App Store Connect), and an App Store Connect API key of its own,
# IOS_API_KEY_BASE64 and IOS_API_KEY_ID, with the team's APPLE_API_ISSUER_ID. Without them there is
# no iOS app.
#
# The key has the App Manager role, which TestFlight groups and Beta App Review need; it can also
# change the App Store listing, so it is not the release's Developer key (APPLE_API_KEY_*, for
# notarization) but a second one that only this workflow reads (docs/ios_release.md, Part 5).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.3.80 (build number 3080; App Store Connect takes each build once)
        required: true
      upload:
        description: Upload to TestFlight
        type: boolean
        default: true
      submit:
        description: Send to external testers (Beta App Review), after the upload
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      upload:
        type: boolean
        default: true
      submit:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ios-app:
    name: Build iOS App
    runs-on: macos-15
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_CODESIGN_IDENTITY: ${{ secrets.IOS_CODESIGN_IDENTITY }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_APP_STORE_APP_ID: ${{ secrets.IOS_APP_STORE_APP_ID }}
      IOS_API_KEY_BASE64: ${{ secrets.IOS_API_KEY_BASE64 }}
      IOS_API_KEY_ID: ${{ secrets.IOS_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

    steps:
      - name: Check the iOS signing secrets
        id: secrets
        shell: bash
        run: |
          missing=()
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_CODESIGN_IDENTITY \
            IOS_PROVISIONING_PROFILE_BASE64 IOS_APP_STORE_APP_ID IOS_API_KEY_BASE64 IOS_API_KEY_ID \
            APPLE_API_ISSUER_ID; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::warning::${missing[*]} not set: no iOS app"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Set up the console build
        if: steps.secrets.outputs.ready == 'true'
        uses: ./.github/actions/setup-desktop-build
        with:
          gpui: "false"
          components: web ios

      # The Apple Distribution identity in a temporary keychain (CODESIGN_IDENTITY) and the iOS API
      # key (APPLE_API_KEY_PATH, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID), as for the macOS release.
      - name: Set up iOS signing
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.IOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.IOS_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.IOS_API_KEY_ID }}
        run: |
          ./scripts/macos-signing-setup.sh
          profile="${RUNNER_TEMP}/Morph.mobileprovision"
          printf '%s' "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${profile}"
          echo "IOS_PROFILE_PATH=${profile}" >> "${GITHUB_ENV}"

      - name: Build Morph.ipa
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          web/console-nsh/scripts/build-ios.sh --sign "${CODESIGN_IDENTITY}" \
            --profile "${IOS_PROFILE_PATH}" --out dist/Morph.ipa
          (cd dist && shasum -a 256 Morph.ipa > Morph.ipa.sha256)

      - name: Upload iOS artifact
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Morph-ios
          path: |
            dist/Morph.ipa
            dist/Morph.ipa.sha256
          if-no-files-found: error
          retention-days: 7

      # Apple's altool, not `nsh publish ios`: nsh 0.5.1's upload is refused when it commits the file
      # (HTTP 409, "not a valid value for the attribute 'sourceFileChecksums'"). altool finds the
      # key as AuthKey_<id>.p8 in ~/.appstoreconnect/private_keys.
      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true' && inputs.upload
        shell: bash
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "${APPLE_API_KEY_PATH}" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app --type ios --file dist/Morph.ipa \
            --apiKey "${APPLE_API_KEY_ID}" --apiIssuer "${APPLE_API_ISSUER_ID}"

      # Waits for Apple to process the build, then submits it to Beta App Review and adds it to the
      # external group (the repository variable IOS_TESTFLIGHT_GROUP, else "Beta"). Builds go out
      # on every tag; a submission refused while an earlier build is still in review only warns.
      - name: Send to external testers
        if: steps.secrets.outputs.ready == 'true' && inputs.upload && inputs.submit
        shell: bash
        timeout-minutes: 75
        env:
          VERSION: ${{ inputs.version }}
          TESTFLIGHT_GROUP: ${{ vars.IOS_TESTFLIGHT_GROUP }}
        run: node web/console-nsh/scripts/testflight-submit.mjs
