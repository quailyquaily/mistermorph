  securitySchemes:
    RuntimeBearer:
      type: http
      scheme: bearer
      description: The configured server.auth_token. This is not a Console browser session token.
  responses:
    BadRequest:
      description: Invalid JSON, parameter or runtime request.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Missing or invalid Authorization Bearer token.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Resource or route not found.
      content:
        text/plain:
          schema:
            type: string
    MethodNotAllowed:
      description: Unsupported method; task submission can also be disabled.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: Concurrent change or runtime busy.
      content:
        text/plain:
          schema:
            type: string
    TooLarge:
      description: Request exceeds the endpoint byte limit.
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: Runtime storage or internal failure.
      content:
        text/plain:
          schema:
            type: string
    Unavailable:
      description: Required runtime capability is absent, queue is full, or execution/storage is unavailable.
      content:
        text/plain:
          schema:
            type: string
