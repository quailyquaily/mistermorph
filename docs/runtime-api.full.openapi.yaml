  /stream/ws:
    get:
      operationId: streamTask
      tags:
      - Streaming
      summary: Subscribe to Console task snapshots
      description: Console only. WebSocket upgrade with the same Authorization Bearer token. No ticket
        or client subscription message is needed. JSON frames follow StreamFrame. A successful upgrade
        does not establish that a task exists. Poll GET /tasks/{task_id} for authoritative state and final
        results. See runtime-api.md for heartbeat, reconnect and snapshot semantics.
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '101':
          description: Subscribe to Console task snapshots
        '400':
          description: Missing task_id or invalid WebSocket upgrade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONError'
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid runtime token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONError'
            text/plain:
              schema:
                type: string
        '403':
          description: Origin rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONError'
            text/plain:
              schema:
                type: string
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONError'
            text/plain:
              schema:
                type: string
        '503':
          description: Stream unavailable or shutting down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONError'
            text/plain:
              schema:
                type: string
      x-websocket-message:
        $ref: '#/components/schemas/StreamFrame'
