# Current implementation reference; see runtime-api.md for behavior and scope.
openapi: 3.0.3
info:
  title: MisterMorph Runtime API — Full
  version: '2026-10-02'
  description: Full Runtime API reference for shared control/data routes and runtime-mounted management,
    provider login and setup extensions. Availability varies by runtime; Console-specific operations are
    marked. Browser-only /api routes are outside this runtime API. The document revision is not a negotiated
    protocol version. Use runtime-api.control.openapi.yaml for task execution, results and approvals.
    See runtime-api.md for behavior and examples.
servers:
- url: http://127.0.0.1:9080/runtime
  description: Default Console listener after setting server.auth_token. Replace with the full runtime
    base URL, including any console.base_path or reverse-proxy prefix.
security:
- RuntimeBearer: []
tags:
- name: Runtime
- name: Tasks
- name: Topics
- name: Approvals
- name: Workspace
- name: Files
- name: Schedules
- name: State
- name: Contacts
- name: Observability
- name: Streaming
- name: Management
- name: Authentication
- name: Setup
paths:
  /health:
    get:
      operationId: getHealth
      tags:
      - Runtime
      summary: Read runtime health and submission availability
      description: Public when HealthEnabled is registered. This is the runtime health route, not the
        Console Web listener /health. submit_enabled is the only submission capability flag; it does not
        advertise every optional feature.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      security: []
    head:
      operationId: headHealth
      tags:
      - Runtime
      summary: Check runtime health without a body
      responses:
        '200':
          description: Check runtime health without a body
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      security: []
  /overview:
    get:
      operationId: getOverview
      tags:
      - Runtime
      summary: Read runtime identity, counters and process metrics
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /commands:
    get:
      operationId: listCommands
      tags:
      - Runtime
      summary: List slash command suggestions
      description: Submit a command as task text to POST /tasks. This catalog is shared; individual runtimes
        can support different commands.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommandSuggestion'
                required:
                - items
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /llm/profiles:
    get:
      operationId: listLLMProfiles
      tags:
      - Runtime
      summary: Read default LLM route and named profiles
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMProfiles'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks:
    get:
      operationId: listTasks
      tags:
      - Tasks
      summary: List tasks newest first
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TaskStatus'
        description: Optional status filter; the server also accepts case-insensitive values and an empty
          value for all statuses.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: topic_id
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque next_cursor from a previous page. Omit for the newest page; do not construct
          or decode cursors.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: submitTask
      tags:
      - Tasks
      summary: Submit task text or a runtime command
      description: Returns HTTP 200 after submission, not the final agent result. Some commands and steering
        acknowledgements finish synchronously. Console may steer an active task in the same topic when
        no file references are supplied. Follow steer_target_task_id when present. A runtime without Submit
        returns 405. No idempotency key or automatic retry guarantee. The JSON decoder reads up to 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskRequest'
            example:
              task: Summarize the project structure.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitTaskResponse'
              example:
                id: task-example
                status: queued
                topic_id: topic-example
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /tasks/{task_id}:
    get:
      operationId: getTask
      tags:
      - Tasks
      summary: Read task status and result
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInfo'
              example:
                id: task-example
                status: done
                task: Summarize the project structure.
                model: configured-model
                timeout: 2m
                created_at: '2026-10-02T00:00:00Z'
                finished_at: '2026-10-02T00:00:10Z'
                topic_id: topic-example
                result:
                  final:
                    output: The CLI starts the runtime and dispatches tasks to the agent engine.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Authoritative task state and result endpoint. Poll until done, failed or canceled.
        pending requires an approval decision. HTTP 200 reports successful lookup, not successful execution;
        inspect status and error. Console normally places the answer at result.final.output. WebSocket
        previews do not replace this result.
  /tasks/{task_id}/stop:
    post:
      operationId: stopTask
      tags:
      - Tasks
      summary: Request cancellation by task ID
      description: No request body. Console returns 200 with found=false when no active task matches.
        Cancellation is asynchronous; keep polling.
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /topics:
    get:
      operationId: listTopics
      tags:
      - Topics
      summary: List topics by most recent update
      description: Requires a topic reader. There is no POST /topics; Console creates a topic when a task
        is first submitted without topic_id.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque next_cursor from a previous page. Omit for the newest page; do not construct
          or decode cursors.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /topics/{topic_id}:
    get:
      operationId: getTopic
      tags:
      - Topics
      summary: Read a topic
      parameters:
      - name: topic_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteTopic
      tags:
      - Topics
      summary: Delete a topic
      description: Requires a topic deleter. Console also stops topic work and removes associated context.
        A missing or already deleted topic returns 404.
      parameters:
      - name: topic_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '204':
          description: Delete a topic
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /topics/{topic_id}/stop:
    post:
      operationId: stopTopic
      tags:
      - Topics
      summary: Request cancellation for a topic
      description: No request body. Stops work through the runtime conversation controller; it does not
        delete the topic.
      parameters:
      - name: topic_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /topics/{topic_id}/regenerate-title:
    post:
      operationId: regenerateTopicTitle
      tags:
      - Topics
      summary: Generate a topic title from its history
      description: No request body. Requires a title generator. Reserved default and _awareness topics
        return 400. A busy topic or concurrent title change returns 409.
      parameters:
      - name: topic_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
  /topics/{topic_id}/tags:
    put:
      operationId: setTopicTags
      tags:
      - Topics
      summary: Replace a topic's tags
      description: Console only. Replaces the whole tag list; send an empty list to clear it. Each tag is
        trimmed and its inner whitespace folded; empty tags and case-insensitive duplicates are dropped,
        keeping the first spelling. At most 5 tags of up to 32 characters, plus the reserved tag pinned. Does not change updated_at.
        JSON body limit is 64 KiB.
      parameters:
      - name: topic_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
              required:
              - tags
      responses:
        '200':
          description: The updated topic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /topic/{topic_id}/context:
    get:
      operationId: getTopicContext
      tags:
      - Topics
      summary: Inspect a topic's last main request
      description: Console only. The topic's last main-loop request split into parts (system prompt
        sections, skills, tool definitions, history, the current message and this run's steps), each
        with a token count and its text, truncated at 16 KiB. Providers report only the request's total
        input. The first look asks the provider to count growing prefixes of the request when it can
        (method provider); otherwise parts are estimated locally. Either way they are scaled to the
        billed total. Only the latest request is kept; available is false before the topic's first run.
      parameters:
      - name: topic_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  conversation_key:
                    type: string
                  topic_id:
                    type: string
                  run_id:
                    type: string
                  model:
                    type: string
                  captured_at:
                    type: string
                    format: date-time
                  context_window_tokens:
                    type: integer
                  input_tokens:
                    type: integer
                  cached_input_tokens:
                    type: integer
                  cache_creation_input_tokens:
                    type: integer
                  compaction_trigger_tokens:
                    type: integer
                  method:
                    type: string
                    enum:
                    - estimate
                    - provider
                    description: provider when the model's provider counted the parts (on the first
                      look), else estimate.
                  counted_input_tokens:
                    type: integer
                    description: The provider's count of the whole request.
                  counted_at:
                    type: string
                    format: date-time
                  count_unsupported:
                    type: boolean
                    description: The provider cannot count this request, so it stays estimated.
                  count_note:
                    type: string
                    enum:
                    - model_changed
                    - count_failed
                    description: Why a countable request is still estimated.
                  parts:
                    type: array
                    items:
                      $ref: '#/components/schemas/TopicContextPart'
                required:
                - available
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /topic/{topic_id}/metadata:
    get:
      operationId: getTopicMetadata
      tags:
      - Topics
      summary: Read workspace and model context usage for a topic
      description: The path uses singular topic. Requires the TopicMetadata callback.
      parameters:
      - name: topic_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /approvals:
    get:
      operationId: listApprovals
      tags:
      - Approvals
      summary: List pending approvals
      description: This is a bounded list, not a cursor page.
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          default: pending
        description: Only pending is supported, case-insensitively.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /approvals/{approval_id}:
    get:
      operationId: getApproval
      tags:
      - Approvals
      summary: Read an approval request
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /approvals/{approval_id}/approve:
    post:
      operationId: approveApproval
      tags:
      - Approvals
      summary: Approve a pending action
      description: An empty body is allowed. The path ID overrides any approval_request_id in JSON. Read
        status, resumed and error in the response; HTTP 200 alone does not mean execution resumed. Continue
        polling the task after the decision.
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
            example:
              actor: external-client
              note: Reviewed the requested action.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecisionResponse'
              example:
                approval_request_id: approval-example
                task_id: task-example
                status: approved
                resumed: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /approvals/{approval_id}/deny:
    post:
      operationId: denyApproval
      tags:
      - Approvals
      summary: Deny a pending action
      description: An empty body is allowed. The path ID overrides any approval_request_id in JSON. Read
        status, resumed and error in the response; HTTP 200 alone does not mean execution resumed. Continue
        polling the task after the decision.
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
            example:
              actor: external-client
              note: Reviewed the requested action.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecisionResponse'
              example:
                approval_request_id: approval-example
                task_id: task-example
                status: denied
                resumed: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /workspace:
    get:
      operationId: getWorkspace
      tags:
      - Workspace
      summary: Resolve the topic workspace
      description: Paths are on the server. Removing an attachment falls back to the server default; it
        does not disable workspace access.
      parameters:
      - name: topic_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: detachWorkspace
      tags:
      - Workspace
      summary: Remove the topic workspace attachment
      description: Paths are on the server. Removing an attachment falls back to the server default; it
        does not disable workspace access.
      parameters:
      - name: topic_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: attachWorkspace
      tags:
      - Workspace
      summary: Attach an existing server directory to a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic_id:
                  type: string
                workspace_dir:
                  type: string
              required:
              - topic_id
              - workspace_dir
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /workspace/tree:
    get:
      operationId: getWorkspaceTree
      tags:
      - Workspace
      summary: List one level of a topic workspace
      parameters:
      - name: topic_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: path
        in: query
        required: false
        schema:
          type: string
        description: Optional tree path.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceTreeListing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /workspace/browse:
    get:
      operationId: browseDirectories
      tags:
      - Workspace
      summary: Browse directories on the server
      parameters:
      - name: path
        in: query
        required: false
        schema:
          type: string
      - name: show_hidden
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Also accepts 1, yes and on as true.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceTreeListing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /workspace/directory:
