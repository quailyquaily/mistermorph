  /files/upload:
    post:
      operationId: uploadFiles
      tags:
      - Files
      summary: Upload files for use in a task
      description: '64 MiB limit for the entire multipart request. Repeat the files field. Destination
        precedence: explicit workspace_dir, resolved topic workspace, runtime default workspace, then
        file_cache_dir/console. Existing filenames get a unique generated name. Reuse each returned dir_name
        and path in file_references on POST /tasks.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  minItems: 1
                topic_id:
                  type: string
                workspace_dir:
                  type: string
              required:
              - files
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/UploadedFile'
