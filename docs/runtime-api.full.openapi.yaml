      description: 'Returns file bytes with Content-Disposition: attachment, not JSON. Supports conditional
        and byte-range requests.'
      parameters:
      - name: dir_name
        in: query
        required: true
        schema:
          type: string
          enum:
          - workspace_dir
          - file_state_dir
          - file_cache_dir
      - name: path
        in: query
        required: true
        schema:
          type: string
        description: File within the selected root; must not escape it.
      - name: topic_id
        in: query
        required: false
        schema:
          type: string
        description: Required when dir_name is workspace_dir.
      responses:
        '200':
          description: File bytes
          content:
            '*/*':
