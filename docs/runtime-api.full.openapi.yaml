        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '206':
          description: Partial file bytes
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: Not modified; no body
        '416':
          description: Requested byte range is unsatisfiable
          content:
            text/plain:
              schema:
                type: string
