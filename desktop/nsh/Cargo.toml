[package]
name = "mistermorph-desktop"
description = "The Mister Morph desktop app: the nsh console in web/console-nsh, drawn by GPUI, with the backend it runs."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"

[workspace]

[[bin]]
name = "MrMorph"
path = "src/main.rs"

[features]
# Follow the `pro` release channel (the Go `pro` build tag).
pro = []

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
env_logger = "0.11"
flate2 = "1"
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
log = "0.4"
mime_guess = "2"
notify-rust = "4"
nsh-base = "=0.6.0"
nsh-engine = { version = "=0.6.0", default-features = false }
# Since 0.6.0 the runtime's parts are features, on by default; 0.5.0 built them in. Without `net`
# the Console's fetch fails ("this host has no network stack") and the app never logs in. All the
# defaults but `webview` (the app has none) and `updater` (src/update.rs is the app's own).
nsh-platform-gpui = { version = "=0.6.0", default-features = false, features = [
    "js",
    "net",
    "websocket",
    "svg",
    "shader",
    "crypto",
    "zlib",
    "editor",
    "emoji-picker",
    "highlight",
    "math",
    "plot",
    "rich-editor",
    "term",
] }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.16", default-features = false, features = ["font-kit", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
tar = "0.4"
# A random private directory for voice recordings (src/voice.rs); already in the lock via GPUI.
tempfile = "3"
ureq = "3"
url = "2"
yaml-rust2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# tests/nsh_features.rs reads the manifests; already in the lock via GPUI.
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# build.rs: the executable's icon on Windows (Explorer, shortcuts, the zip's file).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

# nsh-platform-gpui 0.6.0 with patches/nsh-wayland-touchpad.patch: GPUI's Wayland client
# multiplies touchpad scroll amounts by 3 and reports finger lifts as empty moves, so scrolling
# ran ahead of other apps and never glided; patches/nsh-gpui-masks.patch (masks);
# patches/nsh-scroll-speed.patch (wheel and touchpad scroll twice the system's amount).
# See README.md. Drop this once nsh/GPUI Fast ship the fixes.
[patch.crates-io]
nsh-platform-gpui = { path = "vendor/nsh-platform-gpui" }
