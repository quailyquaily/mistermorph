# .factory/factory.toml: how the factory works on this repository.
# It lives on the orphan branch factory_board, which holds only .factory/.

# The branch builds start from, and a ship run merges into. The remote is origin.
base = "master"

# Names whose "## name · time" sections count as yours.
owners = ["lyric", "factory"]

# What must pass: after each build, in each review, and on base before a ship
# run pushes it (mirrors CI's gofmt check).
test = 'test -z "$(gofmt -l .)" && go vet ./... && go test ./...'

# Run after changes that need generated files or catalogs updated.
after_change = []

# Read before building or reviewing.
read = ["AGENTS.md"]

# Paths the factory must never change.
never = [".github/workflows/", ".factory/factory.toml", "config.yaml", "secrets/"]

# A review with P0 or P1 findings sends the item back to new/ for another
# build while its round is below this; at the limit it waits for you.
max_rounds = 3

# Added to the coder's rules for this repository.
rules = [
  "Scripted tests get a throwaway HOME, given as an absolute path.",
  "The Console is web/console-nsh (nsh 0.4.0; the Vue console is gone): when its sources change, run `nsh check` and `nsh test --web-host tests/noHost.js` in web/console-nsh.",
  "When adding or changing config keys, update assets/config/config.example.yaml.",
  "Write new docs in English only.",
]

prefix = "FT"

timezone = "Asia/Tokyo"
