<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="mistermorph-base-path" content="__MISTERMORPH_BASE_PATH__" />
    <!-- The morph theme's page background; the console has no dark theme. -->
    <meta name="theme-color" content="#edf3f8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mister Morph" />
    <base href="__MISTERMORPH_BASE_HREF__" />
    <title>Mistermorph Console</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="mask-icon" href="./safari-pinned-tab.svg" color="#1f1f1f" />
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-overlay"></div>
    <script type="module">
      import { mountBootSplash } from "/src/components/BootSplash.js";

      mountBootSplash(document.getElementById("boot-overlay"));
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
