version: 2

project_name: mistermorph

before:
  hooks:
    - go mod download

builds:
  - id: mistermorph
    main: ./cmd/mistermorph
    binary: morph
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    hooks:
      post:
        # Signs and notarizes darwin binaries before they are archived (macOS runner only).
        - cmd: ./scripts/macos-sign-cli.sh "{{ .Path }}" "{{ .Target }}"
          output: true

archives:
  - id: default
    ids:
      - mistermorph
    name_template: "morph_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  prerelease: auto
